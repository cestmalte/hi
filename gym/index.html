<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131717">
  <meta name="description" content="Log gym workouts, follow a three-day rotation and track progress by exercise.">
  <title>Gym Log</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="Gym Log overview">
        <span class="brand-icon" aria-hidden="true"><span></span></span>
        <span>Gym<span class="brand-accent"> Log</span></span>
      </a>
      <nav class="navigation" aria-label="Main navigation">
        <a href="#overview" data-page="overview" aria-current="page"><span class="nav-icon icon-overview" aria-hidden="true"></span><span>Overview</span></a>
        <a href="#log" data-page="log"><span class="nav-icon icon-log" aria-hidden="true"></span><span class="nav-desktop">Log workout</span><span class="nav-mobile">Log</span></a>
        <a href="#progress" data-page="progress"><span class="nav-icon icon-progress" aria-hidden="true"></span><span>Progress</span></a>
        <a href="#plan" data-page="plan"><span class="nav-icon icon-plan" aria-hidden="true"></span><span class="nav-desktop">Training plan</span><span class="nav-mobile">Plan</span></a>
      </nav>
      <div class="sidebar-bottom">
        <button class="button button-quiet export-button" type="button" data-action="export"><span class="download-icon" aria-hidden="true">↓</span> Export CSV</button>
        <p class="storage-label"><span aria-hidden="true"></span> Saved in this browser</p>
      </div>
    </aside>
    <div class="workspace">
      <header class="mobile-header">
        <a class="brand" href="#overview" aria-label="Gym Log overview">
          <span class="brand-icon" aria-hidden="true"><span></span></span>
          <span>Gym<span class="brand-accent"> Log</span></span>
        </a>
        <button class="button button-quiet" type="button" data-action="export"><span class="download-icon" aria-hidden="true">↓</span> CSV</button>
      </header>
      <main id="app" class="content" tabindex="-1">
        <noscript><p class="notice">Enable JavaScript to log workouts and view your progress.</p></noscript>
      </main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
